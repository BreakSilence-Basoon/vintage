name: Workspace checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: corepack pnpm test
      - run: corepack pnpm --filter @vintage/timetable-policy test
      - run: corepack pnpm --filter @vintage/ledger-facts test
      - run: corepack pnpm --filter @vintage/ledger-access test
      - run: corepack pnpm --filter @vintage/ledger-store test
      - run: corepack pnpm --filter @vintage/ledger-api test
      - run: corepack pnpm --filter @vintage/access-token test
      - run: corepack pnpm --filter @vintage/oidc-login test
      - run: corepack pnpm --filter @vintage/timetable-read-api test
      - run: corepack pnpm --filter @vintage/timetable-store test
      - run: corepack pnpm --filter @vintage/timetable-api test
